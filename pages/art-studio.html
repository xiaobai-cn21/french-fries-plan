<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>薯条动画 · FryPlan</title><script src="../assets/js/fry-art.js" defer></script><script src="../assets/js/art-studio.js" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf3e8;color:#513923;font-family:system-ui,'Microsoft YaHei',sans-serif;padding:30px 20px}main{max-width:940px;margin:auto}a{color:#aa713b;text-decoration:none;font-size:13px}.eyebrow{font-size:11px;letter-spacing:3px;color:#c68b49;margin:28px 0 8px}h1{font-size:32px;margin:0 0 8px;letter-spacing:-1px}.intro{color:#a38b70;font-size:14px;line-height:1.8}.art-grid{display:grid;grid-template-columns:1fr 1fr 2.5fr;gap:16px;margin:25px 0}.card{background:#fffaf2;border:1px solid #eadcca;border-radius:23px;overflow:hidden;min-width:0;display:flex;flex-direction:column}.card h2{font-size:12px;font-weight:500;letter-spacing:1px;color:#a88660;margin:18px 20px}.card fry-art{width:100%;flex:1;min-height:200px}.oven-card fry-art{min-height:0}.controls{background:#fffaf2;padding:23px;border-radius:23px;border:1px solid #eadcca}.states{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px}button{font:inherit;cursor:pointer;border:1px solid #ecd7bb;border-radius:22px;background:transparent;padding:9px 19px;color:#94704b}button[aria-pressed=true]{background:#ff8b30;color:white;border-color:#ff8b30}label{display:flex;gap:20px;align-items:center;font-size:13px;color:#916a45}input{flex:1;min-width:40px;accent-color:#ee872c}output{font-variant-numeric:tabular-nums;min-width:36px}.note{font-size:12px;color:#a38b70;line-height:1.8;margin-bottom:0}button:focus-visible,a:focus-visible{outline:3px solid #b86c28;outline-offset:3px}@media(max-width:650px){.art-grid{grid-template-columns:1fr 1fr}.oven-card{grid-column:1/-1}.card fry-art{height:180px;min-height:0}.oven-card fry-art{height:auto;aspect-ratio:440/290}.states button{flex:1;padding:9px 12px}h1{font-size:27px}}
</style></head>
<body><main><a href="../index.html">← 返回薯条计划</a><p class="eyebrow">FRYPLAN · LITTLE THINGS, ALIVE</p><h1>一点点，变得金黄。</h1><p class="intro">从一根薯条，到一份小小的成就。每个形状都独立绘制，每一分进度都看得见。</p><div class="art-grid"><section class="card"><h2>01 / 一根薯条</h2><fry-art variant="fry" state="ready" progress="0"></fry-art></section><section class="card"><h2>02 / 薯条伙伴</h2><fry-art variant="carton" state="ready" progress="0"></fry-art></section><section class="card oven-card"><h2>03 / 暖暖的加热时光</h2><fry-art variant="oven" state="ready" progress="0"></fry-art></section></div><section class="controls" aria-label="动画效果预览"><div class="states"><button data-state="ready" aria-pressed="true">准备</button><button data-state="heating" aria-pressed="false">加热</button><button data-state="paused" aria-pressed="false">暂停</button><button data-state="completed" aria-pressed="false">完成</button></div><label for="cooking">烹饪进度<input id="cooking" type="range" min="0" max="100" value="0"><output for="cooking">0%</output></label><p class="note">这里可以预览动画；专注页的颜色由真实计时进度控制。暂停只收起暖光，保留已完成的进度。</p></section></main></body></html>
