<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ed">
  <title>这是你的第一根薯条 · FryPlan</title>
  <link rel="stylesheet" href="../assets/css/first-fry.css?v=2">
  <link rel="stylesheet" href="../assets/css/artwork.css">
  <script src="../assets/js/api-client.js" defer></script>
  <script src="../assets/js/fry-art.js" defer></script>
  <script src="../assets/js/tasks.js" defer></script>
  <script src="../assets/js/progress.js" defer></script>
  <script src="../assets/js/first-fry.js" defer></script>
</head>
<body>
  <main class="first-fry-page">
    <header class="page-top">
      <a class="back-button" href="goal.html" aria-label="返回目标输入页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-7-7 7 7 7"/></svg></a>
    </header>
    <section class="hero" aria-labelledby="first-fry-title">
      <div>
        <h1 id="first-fry-title">这是你的<br>第一根薯条！</h1>
        <p>从这一小步开始，<br>一切都会不一样。</p>
      </div>
      <img class="hero-art potato-left-art" src="../assets/images/potato-left.png" alt="" aria-hidden="true">
    </section>
    <section class="fry-card" aria-label="第一根薯条详情">
      <div class="goal-row">
        <span class="goal-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="m15 9 4-4M17 5h2v2"/></svg></span>
        <h2 id="goal-title">准备你的第一根薯条</h2>
      </div>
      <div class="meta-row">
        <span class="time-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><strong id="time-label">15 分钟</strong></span>
        <span class="effort-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-8"/></svg>低阻力</span>
      </div>
      <p class="task-copy" id="task-copy">先找到和目标相关的一小步，记录基本信息即可。不用追求完美，完成比完美更重要！</p>
    </section>
    <section class="time-choices" id="time-choices" aria-labelledby="time-title" hidden>
      <h2 id="time-title">先做多久？</h2>
      <div class="choice-row">
        <button type="button" data-time="3">3分钟</button>
        <button type="button" data-time="5">5分钟</button>
        <button type="button" data-time="10">10分钟</button>
      </div>
      <p id="time-advice">AI 建议 5 分钟，你也可以按现在的状态调整</p>
    </section>
    <section class="tip-card" id="tip-card" hidden><span aria-hidden="true">💡</span><p>先找到并记录最基础的信息，<br>不用追求完美，完成比完美更重要！</p></section>
    <button class="primary-action" id="confirm">放进薯条盒 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
    <p class="quote">“千里之行，始于一根薯条。”</p>
    <p class="status" id="status" role="status"></p>
  </main>
</body>
</html>
