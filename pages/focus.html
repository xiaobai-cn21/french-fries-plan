<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff1d9">
  <title>专注加热 · 薯条计划</title>
  <link rel="stylesheet" href="../assets/css/focus.css">
  <link rel="stylesheet" href="../assets/css/artwork.css">
  <link rel="stylesheet" href="../assets/css/steps.css">
  <script src="../assets/js/fry-art.js" defer></script>
  <script src="../assets/js/progress.js" defer></script><script src="../assets/js/tasks.js" defer></script><script src="../assets/js/focus.js" defer></script>
</head>
<body>
  <main class="focus-page" id="focus-page">
    <section class="focus-room" aria-labelledby="focus-title">
      <header><a href="../index.html" id="exit">退出</a><button id="sound" aria-label="开启加热环境音" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></button></header>
      <h1 id="focus-title">每一分钟，<br>都在把目标重新<span>加热</span></h1>
      <p id="active-task" style="text-align:center;font-size:13px;color:#998269;margin:-8px 0 16px;overflow-wrap:anywhere" hidden></p>
      <p class="step-progress" id="step-progress" hidden></p>
      <div class="timer" role="timer" aria-label="剩余专注时间">
        <svg class="timer-ring" viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="heat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb052"/><stop offset=".5" stop-color="#ff862e"/><stop offset="1" stop-color="#ff4e23"/></linearGradient></defs><circle class="ring-track" cx="120" cy="120" r="106"/><circle class="ring-fill" id="ring" cx="120" cy="120" r="106" pathLength="100"/></svg>
        <div class="timer-copy"><span id="time">15:00</span><span class="duration">/ 15:00</span></div>
      </div>
      <div class="plant" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span></span></div><div class="pencils" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
      <div class="progress-area"><p id="heat-status">正在加热中… <strong id="percentage">0%</strong></p><div class="progress-track" id="progress" role="progressbar" aria-label="专注加热进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div></div>
    </section>
    <section class="oven-scene"><fry-art id="oven-art" variant="oven" single state="ready" progress="0"></fry-art></section>
    <footer class="controls"><button id="pause"><span class="control-circle"><svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></span><span id="pause-label">暂停</span></button><button id="finish"><span class="control-circle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></span><span>结束</span></button></footer>
  </main>
  <dialog id="finish-dialog" aria-labelledby="finish-title"><span class="dialog-fries" aria-hidden="true">🍟</span><h2 id="finish-title">这次加热，先到这里</h2><p id="finish-copy"></p><p class="verification-note">做完了吗？上传截图，确认完成并获得 3 点能量。</p><a class="primary" href="upload.html" style="display:block;color:white">上传成果截图</a><a href="../index.html">返回首页</a></dialog>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
